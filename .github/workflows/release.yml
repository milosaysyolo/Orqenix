name: Release OSS

on:
  push:
    branches: [main]
    paths:
      - ".changeset/**"
      - "packages/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (validate but do not publish)"
        type: boolean
        default: true
      skip_charter_gates:
        description: "Skip charter gates (use only in emergencies)"
        type: boolean
        default: false

concurrency:
  group: release-oss
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write
  issues: write

jobs:
  pre-flight:
    name: Pre-flight Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      verdict: ${{ steps.check.outputs.verdict }}
      blocking_failures: ${{ steps.check.outputs.blocking_failures }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Orqenix-Pro (sibling)
        uses: ./.github/actions/checkout-orqenix-repo
        with:
          scope: pro
          layout: sibling
          path: ../Orqenix-Pro
          token: ${{ secrets.ORQENIX_COORDINATOR_PAT }}
          fetch-depth: 1
          verify-paths: |
            packages/license

      - name: Validate NPM_TOKEN exists (skip on dry-run)
        if: inputs.dry_run != true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "ERROR: NPM_TOKEN secret missing. Cannot publish."
            exit 1
          fi
          echo "NPM_TOKEN present."

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Announce run mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch. dry_run=${{ inputs.dry_run }}"
            if [ "${{ inputs.dry_run }}" = "false" ]; then
              echo "MODE: LIVE PUBLISH"
            else
              echo "MODE: DRY RUN (no publish)"
            fi
          else
            echo "MODE: PUSH event — build/verify only, publish job is guarded OFF"
          fi

      - name: Verify lockfile in sync
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: pnpm install --frozen-lockfile --lockfile-only

      - name: Verify onlyBuiltDependencies allowlist
        run: node scripts/release/verify-only-built-deps.mjs

      - name: Check for changesets
        id: changesets-check
        run: |
          CHANGESET_COUNT=$(ls .changeset/*.md 2>/dev/null | grep -v README | wc -l || echo 0)
          echo "changeset_count=$CHANGESET_COUNT" >> "$GITHUB_OUTPUT"
          if [ "$CHANGESET_COUNT" -eq 0 ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "No changesets to publish. Skipping release."
            echo "verdict=no-go" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=go" >> "$GITHUB_OUTPUT"
          fi

      - name: Pre-flight verdict
        id: check
        run: |
          if [ "${{ steps.changesets-check.outputs.verdict }}" = "no-go" ]; then
            echo "verdict=no-go" >> "$GITHUB_OUTPUT"
            echo "blocking_failures=no-changesets" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=go" >> "$GITHUB_OUTPUT"
            echo "blocking_failures=" >> "$GITHUB_OUTPUT"
          fi

  build-and-verify:
    name: Build and Verify
    needs: pre-flight
    if: needs.pre-flight.outputs.verdict != 'no-go'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Orqenix-Pro (sibling)
        uses: ./.github/actions/checkout-orqenix-repo
        with:
          scope: pro
          layout: sibling
          path: ../Orqenix-Pro
          token: ${{ secrets.ORQENIX_COORDINATOR_PAT }}
          fetch-depth: 1
          verify-paths: |
            packages/license

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies with native builds
        run: pnpm install --frozen-lockfile --config.ignore-scripts=false

      - name: Rebuild native deps
        run: pnpm rebuild @mongodb-js/zstd better-sqlite3 esbuild @swc/core sharp --pending --config.ignore-scripts=false

      - name: Build all packages
        run: pnpm -r build

      - name: Run pre-publish checks (C01 to C24) if script exists
        run: |
          if [ -f "scripts/release/run-prepublish-checks.mjs" ]; then
            node scripts/release/run-prepublish-checks.mjs
          else
            echo "Pre-publish checks script not found; skipping (acceptable for v0.5.0 setup phase)."
          fi

      - name: Run charter gates (unless skipped)
        if: inputs.skip_charter_gates != true
        run: |
          if [ -f "scripts/charter/verify-phase-5.ts" ]; then
            pnpm exec tsx scripts/charter/verify-phase-5.ts
          else
            echo "Phase 5 charter script not found; skipping."
          fi

      - name: "Convert cross-scope file: deps to npm versions"
        run: |
          if [ -f "scripts/release/convert-cross-scope-deps.mjs" ]; then
            node scripts/release/convert-cross-scope-deps.mjs
          else
            echo "Cross-scope conversion script not found; assuming no file: deps."
          fi

      - name: Run tests (serial for first publish to avoid Vite resolution races)
        run: pnpm -r --workspace-concurrency=1 test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oss-build-artifacts
          path: |
            packages/*/dist/
            packages/*/package.json
          retention-days: 7

  publish:
    name: Publish to npm
    needs: [pre-flight, build-and-verify]
    # SAFETY: publish only on an explicit manual dispatch with dry_run=false.
    # On push events the dry_run input is undefined, so
    # 'inputs.dry_run != true' would evaluate TRUE and could trigger a
    # live publish without an explicit go. This guard blocks that.
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.dry_run == false &&
      needs.pre-flight.outputs.verdict != 'no-go'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      published_packages: ${{ steps.changesets.outputs.publishedPackages }}
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: write
      id-token: write
      packages: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ORQENIX_COORDINATOR_PAT }}

      - name: Checkout Orqenix-Pro (sibling)
        uses: ./.github/actions/checkout-orqenix-repo
        with:
          scope: pro
          layout: sibling
          path: ../Orqenix-Pro
          token: ${{ secrets.ORQENIX_COORDINATOR_PAT }}
          fetch-depth: 1
          verify-paths: |
            packages/license

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install with native builds
        run: pnpm install --frozen-lockfile --config.ignore-scripts=false

      - name: Rebuild native deps
        run: pnpm rebuild @mongodb-js/zstd better-sqlite3 esbuild @swc/core sharp --pending --config.ignore-scripts=false

      - name: Build all packages
        run: pnpm -r build

      - name: Convert cross-scope deps for publish
        run: |
          if [ -f "scripts/release/convert-cross-scope-deps.mjs" ]; then
            node scripts/release/convert-cross-scope-deps.mjs
          fi

      - name: Configure git for changesets
        run: |
          git config user.name "orqenix-release-bot"
          git config user.email "release-bot@orqenix.dev"

      - name: Version packages
        env:
          # Use ORQENIX_COORDINATOR_PAT instead of GITHUB_TOKEN for changesets.
          # Default GITHUB_TOKEN lacks scopes needed for some changesets ops
          # (tag push, draft PR). Fine-grained PAT covers what we need;
          # changelog generation uses the default @changesets/cli/changelog
          # (no GitHub API fetch, so no read:user scope needed).
          GITHUB_TOKEN: ${{ secrets.ORQENIX_COORDINATOR_PAT }}
        run: pnpm exec changeset version

      - name: Publish to npm
        id: publish
        run: pnpm -r publish --access public --provenance --no-git-checks
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push version commit
        run: |
          git config user.name "orqenix-release-bot"
          git config user.email "release-bot@orqenix.dev"
          git add -A
          git commit -m "chore(release): version packages" --allow-empty
          git push origin HEAD:main

      - name: Extract version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  post-publish-smoke:
    name: Post-Publish Smoke Test
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Smoke test installation from npm
        run: |
          mkdir smoke-test
          cd smoke-test
          npm init -y
          # Install primary public OSS package to verify it's on registry
          npm install @orqenix/core --no-save --no-package-lock || {
            echo "Smoke test FAILED: cannot install @orqenix/core from registry"
            echo "Note: package may need 1 to 2 min to propagate after publish"
            exit 1
          }
          # Verify it imports
          node -e "const x = require('@orqenix/core'); console.log('Loaded:', Object.keys(x).slice(0,5))" || {
            echo "Smoke test FAILED: published package does not import cleanly"
            exit 1
          }
          echo "Smoke test PASSED"

  notify:
    name: Notify (OSS Release Complete)
    needs: [publish, post-publish-smoke]
    if: always() && needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Create release summary issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const version = '${{ needs.publish.outputs.version }}';
            const packagesJson = `${{ needs.publish.outputs.published_packages }}` || '[]';
            let packages = [];
            try {
              packages = JSON.parse(packagesJson);
            } catch (e) {
              console.log('Failed to parse published_packages:', e.message);
            }

            const pkgList = packages.slice(0, 8)
              .map(p => `- https://www.npmjs.com/package/${p.name}/v/${p.version}`)
              .join('\n');
            const more = packages.length > 8
              ? `\n- and ${packages.length - 8} more`
              : '';

            const body = [
              `# OSS Release v${version} Published`,
              ``,
              `Published **${packages.length}** @orqenix/* packages to npm.`,
              ``,
              `## Verify on npm`,
              pkgList + more,
              ``,
              `## Provenance`,
              `All packages signed with SLSA provenance from workflow run #${context.runId}.`,
              ``,
              `## Next: Trigger Pro Release`,
              `**Pro publish is NOT auto-triggered** (safety mode for first publish).`,
              ``,
              `To trigger Pro release manually, run:`,
              '```bash',
              `gh workflow run trigger-pro.yml -f oss_version=${version}`,
              '```',
              ``,
              `Or use Actions UI: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/trigger-pro.yml`,
              ``,
              `## Workflow run`,
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Release v${version} (OSS) published`,
              body,
              labels: ['release', 'auto-generated', 'awaiting-pro-trigger'],
              assignees: ['milosaysyolo'],
            });
            core.setOutput('issue_number', issue.data.number);
            console.log(`Created release issue #${issue.data.number}`);
