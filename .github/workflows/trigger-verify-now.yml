name: trigger-verify-now

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to verify"
        required: true
        default: "phase-8/verify-kit"

jobs:
  call:
    uses: ./.github/workflows/verify-phase-8-full.yml
    with:
      branch: ${{ github.event.inputs.branch }}

  capture-test-failure-windows:
    name: Capture test failure on Windows (memory-engine)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.10.0"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Capture memory-engine test output
        run: node scripts/verify/capture-test-failures.mjs @orqenix/memory-engine
        continue-on-error: true
      - name: Upload failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-windows
          path: test-failure-*.json
