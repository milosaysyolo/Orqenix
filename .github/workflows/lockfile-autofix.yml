name: Lockfile Autofix Bot

on:
  workflow_run:
    workflows: ["Lockfile Guard"]
    types: [completed]

permissions:
  contents: read

jobs:
  autofix:
    name: Auto-sync pnpm-lock.yaml
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: write
      actions: read

    steps:
      - name: Download signal artifact
        id: download
        uses: actions/download-artifact@v4
        with:
          name: lockfile-autofix-signal
          path: .autofix-signal
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Validate signal
        id: validate
        run: |
          if [ ! -f .autofix-signal/signal.json ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Parse signal
        id: signal
        if: steps.validate.outputs.should_run == 'true'
        run: |
          SIGNAL=$(cat .autofix-signal/signal.json)
          echo "pr_number=$(echo "$SIGNAL" | jq -r '.pr_number')" >> "$GITHUB_OUTPUT"
          echo "pr_head_repo=$(echo "$SIGNAL" | jq -r '.pr_head_repo')" >> "$GITHUB_OUTPUT"
          echo "pr_head_ref=$(echo "$SIGNAL" | jq -r '.pr_head_ref')" >> "$GITHUB_OUTPUT"
          echo "pr_head_sha=$(echo "$SIGNAL" | jq -r '.pr_head_sha')" >> "$GITHUB_OUTPUT"
          echo "is_fork=$(echo "$SIGNAL" | jq -r '.is_fork')" >> "$GITHUB_OUTPUT"
          echo "actor=$(echo "$SIGNAL" | jq -r '.actor')" >> "$GITHUB_OUTPUT"

      - name: Check fork policy
        id: fork_policy
        if: steps.validate.outputs.should_run == 'true'
        env:
          ALLOW_FORK_AUTOFIX: ${{ vars.ALLOW_FORK_AUTOFIX || 'false' }}
        run: |
          if [ "${{ steps.signal.outputs.is_fork }}" = "true" ] && [ "$ALLOW_FORK_AUTOFIX" != "true" ]; then
            echo "skip_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment fork guidance
        if: steps.validate.outputs.should_run == 'true' && steps.fork_policy.outputs.skip_push == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.signal.outputs.pr_number }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --body "Lockfile out of sync. Fork PR autofix disabled. Run \`pnpm run lockfile:sync\` locally and push."

      # Checkout PR head as primary OSS workspace
      - name: Checkout PR head
        if: steps.validate.outputs.should_run == 'true' && steps.fork_policy.outputs.skip_push == 'false'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.signal.outputs.pr_head_repo }}
          ref: ${{ steps.signal.outputs.pr_head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Verify head SHA (race protection)
        if: steps.validate.outputs.should_run == 'true' && steps.fork_policy.outputs.skip_push == 'false'
        run: |
          CURRENT=$(git rev-parse HEAD)
          if [ "$CURRENT" != "${{ steps.signal.outputs.pr_head_sha }}" ]; then
            echo "Race detected; aborting."
            echo "RACE_DETECTED=true" >> "$GITHUB_ENV"
          fi

      - name: Exit on race
        if: env.RACE_DETECTED == 'true'
        run: exit 0

      # Always need Pro sibling for lockfile resolution because integration workspace
      # links to Pro packages. Lockfile sync without Pro present fails with
      # ERR_PNPM_LINKED_PKG_DIR_NOT_FOUND.
      - name: Checkout Orqenix-Pro (sibling)
        if: steps.validate.outputs.should_run == 'true' && steps.fork_policy.outputs.skip_push == 'false' && env.RACE_DETECTED != 'true'
        uses: ./.github/actions/checkout-orqenix-repo
        with:
          scope: pro
          layout: sibling
          path: ../Orqenix-Pro
          token: ${{ secrets.ORQENIX_COORDINATOR_PAT }}
          fetch-depth: 1
          verify-paths: |
            packages/license

      - name: Setup Node
        if: env.RACE_DETECTED != 'true' && steps.validate.outputs.should_run == 'true' && steps.fork_policy.outputs.skip_push == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        if: env.RACE_DETECTED != 'true' && steps.validate.outputs.should_run == 'true' && steps.fork_policy.outputs.skip_push == 'false'
        run: |
          corepack enable
          PNPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Run sync-lockfile
        if: env.RACE_DETECTED != 'true' && steps.validate.outputs.should_run == 'true' && steps.fork_policy.outputs.skip_push == 'false'
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: bash scripts/release/sync-lockfile.sh

      - name: Verify diff scope
        if: env.RACE_DETECTED != 'true' && steps.validate.outputs.should_run == 'true' && steps.fork_policy.outputs.skip_push == 'false'
        run: |
          CHANGED=$(git status --porcelain | awk '{print $2}')
          UNAUTHORIZED=$(echo "$CHANGED" | grep -v -E '^(pnpm-lock\.yaml)$' || true)
          if [ -n "$UNAUTHORIZED" ]; then
            echo "ERROR: Unexpected files modified by autofix:"
            echo "$UNAUTHORIZED"
            exit 1
          fi
          if [ -z "$CHANGED" ]; then
            echo "NOTHING_TO_COMMIT=true" >> "$GITHUB_ENV"
          fi

      - name: Configure git
        if: env.RACE_DETECTED != 'true' && env.NOTHING_TO_COMMIT != 'true' && steps.validate.outputs.should_run == 'true' && steps.fork_policy.outputs.skip_push == 'false'
        run: |
          git config user.name "orqenix-autofix[bot]"
          git config user.email "orqenix-autofix[bot]@users.noreply.github.com"

      - name: Commit and push
        if: env.RACE_DETECTED != 'true' && env.NOTHING_TO_COMMIT != 'true' && steps.validate.outputs.should_run == 'true' && steps.fork_policy.outputs.skip_push == 'false'
        run: |
          git add pnpm-lock.yaml
          git commit -m "chore: sync pnpm-lock.yaml (autofix)

          Co-authored-by: ${{ steps.signal.outputs.actor }} <${{ steps.signal.outputs.actor }}@users.noreply.github.com>"
          git push origin HEAD:${{ steps.signal.outputs.pr_head_ref }}

      - name: Comment success
        if: env.RACE_DETECTED != 'true' && env.NOTHING_TO_COMMIT != 'true' && steps.validate.outputs.should_run == 'true' && steps.fork_policy.outputs.skip_push == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.signal.outputs.pr_number }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "Lockfile autofixed by bot. Run \`git pull --rebase\` before next push."
