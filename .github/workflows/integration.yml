name: Cross-Repo Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pro_ref:
        description: "Pro repo ref to integrate against"
        required: true
        default: "v0.5.0-phase-5"

permissions:
  contents: read

env:
  PRO_REF: ${{ inputs.pro_ref || 'v0.5.0-phase-5' }}

jobs:
  integration:
    name: integration (${{ matrix.os }}, ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]

    steps:
      # ---- Checkout OSS into ./layout/Orqenix ----
      - name: Checkout Orqenix (OSS)
        uses: actions/checkout@v4
        with:
          repository: milosaysyolo/Orqenix
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: layout/Orqenix
          fetch-depth: 0

      # ---- Checkout Pro alongside ----
      - name: Checkout Orqenix-Pro
        uses: actions/checkout@v4
        with:
          repository: milosaysyolo/Orqenix-Pro
          ref: ${{ env.PRO_REF }}
          token: ${{ secrets.ORQENIX_COORDINATOR_PAT }}
          path: layout/Orqenix-Pro
          fetch-depth: 0

      - name: Verify cross-scope paths
        shell: bash
        run: |
          REQUIRED=(
            "layout/Orqenix-Pro/packages/license"
          )
          for p in "${REQUIRED[@]}"; do
            if [ ! -d "$p" ]; then
              echo "ERROR: required Pro path missing: $p (Pro ref: ${{ env.PRO_REF }})"
              exit 1
            fi
            echo "OK: $p"
          done

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Setup pnpm via Corepack
        shell: bash
        working-directory: layout/Orqenix
        run: |
          corepack enable
          PNPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: Install (frozen)
        shell: bash
        working-directory: layout/Orqenix
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: pnpm install --frozen-lockfile

      - name: Approve native builds (allowlist only)
        shell: bash
        working-directory: layout/Orqenix
        run: |
          # Re-run install with build-from-source allowed ONLY for allowlisted packages
          pnpm rebuild better-sqlite3 esbuild @swc/core || true

      - name: Build
        shell: bash
        working-directory: layout/Orqenix
        run: pnpm -r build

      - name: Test
        shell: bash
        working-directory: layout/Orqenix
        run: pnpm -r test
