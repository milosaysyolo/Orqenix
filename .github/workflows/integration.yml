name: Cross-Repo Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pro_ref:
        description: "Pro repo ref to integrate against"
        required: true
        default: "v0.5.0-phase-5"

permissions:
  contents: read

jobs:
  integration:
    name: integration (${{ matrix.os }}, ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]

    steps:
      # ---- Checkout OSS into ./layout/Orqenix ----
      - name: Checkout Orqenix (OSS)
        uses: actions/checkout@v4
        with:
          repository: milosaysyolo/Orqenix
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: layout/Orqenix
          fetch-depth: 0

      # ---- Resolve Pro ref from OSS cross-repo-refs.json ----
      - name: Resolve Pro ref
        id: pro-ref
        shell: bash
        run: |
          cd layout/Orqenix
          echo "ref=$(node scripts/ci/get-pro-ref.mjs)" >> "$GITHUB_OUTPUT"

      # ---- Checkout Pro alongside (inside layout via composite action) ----
      - name: Checkout Orqenix-Pro (inside layout)
        # Skip Pro checkout for fork PRs (secrets not available)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ./layout/Orqenix/.github/actions/checkout-orqenix-repo
        with:
          scope: pro
          ref: ${{ steps.pro-ref.outputs.ref }}
          layout: inside
          path: layout/Orqenix-Pro
          token: ${{ secrets.ORQENIX_COORDINATOR_PAT }}
          fetch-depth: 0
          verify-paths: |
            packages/license

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Setup pnpm via Corepack
        shell: bash
        working-directory: layout/Orqenix
        run: |
          corepack enable
          PNPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: Install (frozen)
        shell: bash
        working-directory: layout/Orqenix
        run: pnpm install --frozen-lockfile --config.ignore-scripts=false

      - name: Approve native builds (allowlist only)
        shell: bash
        working-directory: layout/Orqenix
        run: pnpm rebuild @mongodb-js/zstd better-sqlite3 esbuild @swc/core sharp --pending --config.ignore-scripts=false

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/transformers
            layout/Orqenix/node_modules/.cache/transformers
            layout/Orqenix/packages/embedding-local/.cache
          key: hf-models-${{ runner.os }}-${{ hashFiles('layout/Orqenix/packages/embedding-local/package.json') }}
          restore-keys: |
            hf-models-${{ runner.os }}-

      - name: Warm HuggingFace cache (best-effort)
        shell: bash
        working-directory: layout/Orqenix
        run: pnpm --filter @orqenix/embedding-local run warm-cache

      - name: Build
        shell: bash
        working-directory: layout/Orqenix
        run: pnpm build

      - name: Integration test (transformers offline)
        shell: bash
        working-directory: layout/Orqenix
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: pnpm test
