name: Policy Credential Guard

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".orqenix/policy/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".orqenix/policy/**"

permissions:
  contents: read

jobs:
  guard:
    name: Credential handling policy guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Check no inline tokens in git clone URLs
        run: |
          set -e
          # Look for tokens being passed inline (not via env)
          VIOLATIONS=$(grep -rn "git clone.*://[a-zA-Z0-9_]\+:" .github/workflows/ .github/actions/ || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "POLICY VIOLATION: tokens inlined in git clone URLs."
            echo "Use env-based pattern instead. See .orqenix/policy/credential-handling.md Rule 1."
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "No inline-token git clone URLs found."

      - name: Check sanitize step follows every token-injected clone
        run: |
          set -e
          # Find every workflow file with x-access-token clone
          FILES_WITH_CLONE=$(grep -rl "x-access-token" .github/workflows/ .github/actions/ || true)
          MISSING_SANITIZE=()
          for f in $FILES_WITH_CLONE; do
            # Skip the composite action itself (it has built-in sanitize)
            if [ "$f" = ".github/actions/checkout-orqenix-repo/action.yml" ]; then
              continue
            fi
            if ! grep -q "remote set-url origin https://github.com" "$f"; then
              MISSING_SANITIZE+=("$f")
            fi
          done
          if [ ${#MISSING_SANITIZE[@]} -gt 0 ]; then
            echo "POLICY VIOLATION: token-injected clone without sanitize step:"
            printf '  - %s\n' "${MISSING_SANITIZE[@]}"
            echo "See .orqenix/policy/credential-handling.md Rule 2."
            exit 1
          fi
          echo "All token-injected clones have sanitize follow-up."

      - name: Check cross-repo checkouts use composite action
        run: |
          set -e
          # Find raw actions/checkout@v4 with Orqenix-Pro or Orqenix-Cloud
          RAW_CROSS=$(grep -rn -A 5 "actions/checkout@v4" .github/workflows/ \
            | grep -E "repository:\s*milosaysyolo/(Orqenix-Pro|Orqenix-Cloud)" || true)
          if [ -n "$RAW_CROSS" ]; then
            echo "POLICY VIOLATION: cross-repo checkout not using composite action:"
            echo "$RAW_CROSS"
            echo "Use .github/actions/checkout-orqenix-repo composite action."
            echo "See .orqenix/policy/credential-handling.md Rule 7."
            exit 1
          fi
          echo "All cross-repo checkouts use composite action."

      - name: Check no pull_request_target with secrets
        run: |
          set -e
          PRT_FILES=$(grep -rl "pull_request_target" .github/workflows/ || true)
          for f in $PRT_FILES; do
            if grep -q "secrets\." "$f"; then
              echo "POLICY VIOLATION: $f uses pull_request_target AND references secrets."
              echo "See .orqenix/policy/credential-handling.md Rule 3."
              exit 1
            fi
          done
          echo "No risky pull_request_target with secrets found."

      - name: Summary
        if: success()
        run: echo "All credential handling policy checks passed."
