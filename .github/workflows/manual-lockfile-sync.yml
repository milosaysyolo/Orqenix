name: Manual Lockfile Sync

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "OSS branch to sync lockfile on"
        required: true
        default: "main"
      pro_ref_override:
        description: "Override Pro ref (leave blank to use cross-repo-refs.json)"
        required: false
        default: ""
      also_sync_pro:
        description: "Also sync Pro repo lockfile in the same run"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout OSS (inside workspace, primary)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Checkout Orqenix-Pro (sibling)
        uses: ./.github/actions/checkout-orqenix-repo
        with:
          scope: pro
          ref: ${{ inputs.pro_ref_override }}
          layout: sibling
          path: ../Orqenix-Pro
          token: ${{ secrets.ORQENIX_COORDINATOR_PAT }}
          fetch-depth: 0
          verify-paths: |
            packages/license

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm via Corepack
        run: |
          corepack enable
          PNPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: Regenerate OSS lockfile
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: pnpm install --lockfile-only

      - name: Verify --frozen-lockfile passes
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: pnpm install --frozen-lockfile --lockfile-only

      - name: Verify allowlist preserved
        run: node scripts/release/verify-only-built-deps.mjs

      - name: Check OSS diff scope
        run: |
          CHANGED=$(git status --porcelain | awk '{print $2}')
          echo "OSS changed files: $CHANGED"
          UNAUTHORIZED=$(echo "$CHANGED" | grep -v -E '^(pnpm-lock\.yaml)$' || true)
          if [ -n "$UNAUTHORIZED" ]; then
            echo "ERROR: Unexpected files modified:"
            echo "$UNAUTHORIZED"
            exit 1
          fi
          if [ -z "$CHANGED" ]; then
            echo "OSS_NOTHING_TO_COMMIT=true" >> "$GITHUB_ENV"
          fi

      - name: Configure git identity
        run: |
          git config --global user.name "orqenix-autofix[bot]"
          git config --global user.email "orqenix-autofix[bot]@users.noreply.github.com"

      - name: Commit and push OSS lockfile
        if: env.OSS_NOTHING_TO_COMMIT != 'true'
        run: |
          git add pnpm-lock.yaml
          git commit -m "chore: sync pnpm-lock.yaml (manual workflow_dispatch)

          Triggered by: ${{ github.actor }}
          "
          git push origin HEAD:${{ inputs.target_branch }}

      - name: Sync Pro lockfile (optional)
        if: inputs.also_sync_pro == true
        working-directory: ../Orqenix-Pro
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
          GH_TOKEN: ${{ secrets.ORQENIX_COORDINATOR_PAT }}
        run: |
          if ! node -e "process.exit(require('./package.json').packageManager ? 0 : 1)"; then
            echo "Pro repo has no packageManager pin; skipping."
            exit 0
          fi
          PRO_PNPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
          corepack prepare pnpm@${PRO_PNPM_VERSION} --activate

          pnpm install --lockfile-only
          pnpm install --frozen-lockfile --lockfile-only

          if git diff --quiet pnpm-lock.yaml; then
            echo "Pro already in sync"
            exit 0
          fi

          REMOTE_URL="https://x-access-token:${GH_TOKEN}@github.com/milosaysyolo/Orqenix-Pro.git"
          git remote set-url origin "$REMOTE_URL"
          git config user.name "orqenix-autofix[bot]"
          git config user.email "orqenix-autofix[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: sync pnpm-lock.yaml (paired with OSS sync)"
          git push origin HEAD:main

          # SANITIZE: reset remote URL to non-tokenized form
          git remote set-url origin "https://github.com/milosaysyolo/Orqenix-Pro.git"
