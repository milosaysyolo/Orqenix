name: Manual Lockfile Sync

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "OSS branch to sync lockfile on"
        required: true
        default: "main"
      pro_ref_override:
        description: "Override Pro ref (leave blank to use .orqenix/cross-repo-refs.json)"
        required: false
        default: ""
      also_sync_pro:
        description: "Also sync Pro repo lockfile in the same run"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ---- Checkout OSS as sibling at $GITHUB_WORKSPACE/../Orqenix ----
      # GitHub Actions default workspace path is /home/runner/work/<repo>/<repo>
      # We checkout into parent dir to mirror local dev layout:
      #   /home/runner/work/Orqenix/Orqenix      (OSS)
      #   /home/runner/work/Orqenix/Orqenix-Pro  (Pro, sibling)
      # This matches integration/package.json's "file:../../Orqenix-Pro/packages/license"
      - name: Checkout OSS repo
        uses: actions/checkout@v4
        with:
          repository: milosaysyolo/Orqenix
          ref: ${{ inputs.target_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: Orqenix
          fetch-depth: 0

      - name: Resolve Pro ref from single source of truth
        id: pro-ref
        working-directory: Orqenix
        run: |
          if [ -n "${{ inputs.pro_ref_override }}" ]; then
            REF="${{ inputs.pro_ref_override }}"
            echo "Using override Pro ref: $REF"
          else
            REF=$(node scripts/ci/get-pro-ref.mjs)
            echo "Using pinned Pro ref from .orqenix/cross-repo-refs.json: $REF"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout Pro repo as sibling
        uses: actions/checkout@v4
        with:
          repository: milosaysyolo/Orqenix-Pro
          ref: ${{ steps.pro-ref.outputs.ref }}
          token: ${{ secrets.ORQENIX_COORDINATOR_PAT }}
          path: Orqenix-Pro
          fetch-depth: 0

      - name: Setup environment paths
        run: |
          echo "OSS_DIR=$GITHUB_WORKSPACE/Orqenix" >> "$GITHUB_ENV"
          echo "PRO_DIR=$GITHUB_WORKSPACE/Orqenix-Pro" >> "$GITHUB_ENV"

      - name: Verify cross-scope paths exist
        run: |
          test -d "$OSS_DIR" || { echo "ERROR: OSS dir missing"; exit 1; }
          test -d "$PRO_DIR/packages/license" || {
            echo "ERROR: Pro packages/license missing at ref ${{ steps.pro-ref.outputs.ref }}"
            exit 1
          }
          echo "Layout OK:"
          ls -la "$GITHUB_WORKSPACE"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm via Corepack
        working-directory: ${{ env.OSS_DIR }}
        run: |
          corepack enable
          PNPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      # ---- Sync OSS lockfile ----
      - name: Regenerate OSS lockfile
        working-directory: ${{ env.OSS_DIR }}
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: pnpm install --lockfile-only

      - name: Verify OSS --frozen-lockfile passes
        working-directory: ${{ env.OSS_DIR }}
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: pnpm install --frozen-lockfile --lockfile-only

      - name: Verify allowlist preserved
        working-directory: ${{ env.OSS_DIR }}
        run: node scripts/release/verify-only-built-deps.mjs

      - name: Check OSS diff scope
        working-directory: ${{ env.OSS_DIR }}
        run: |
          CHANGED=$(git status --porcelain | awk '{print $2}')
          echo "OSS changed files:"
          echo "$CHANGED"
          UNAUTHORIZED=$(echo "$CHANGED" | grep -v -E '^(pnpm-lock\.yaml)$' || true)
          if [ -n "$UNAUTHORIZED" ]; then
            echo "ERROR: Unexpected files modified in OSS:"
            echo "$UNAUTHORIZED"
            exit 1
          fi
          if [ -z "$CHANGED" ]; then
            echo "OSS already in sync"
            echo "OSS_NOTHING_TO_COMMIT=true" >> "$GITHUB_ENV"
          fi

      - name: Configure git identity
        run: |
          git config --global user.name "orqenix-autofix[bot]"
          git config --global user.email "orqenix-autofix[bot]@users.noreply.github.com"

      - name: Commit and push OSS lockfile
        if: env.OSS_NOTHING_TO_COMMIT != 'true'
        working-directory: ${{ env.OSS_DIR }}
        run: |
          git add pnpm-lock.yaml
          git commit -m "chore: sync pnpm-lock.yaml (manual workflow_dispatch)

          Triggered by: ${{ github.actor }}
          Pro ref used: ${{ steps.pro-ref.outputs.ref }}
          "
          git push origin HEAD:${{ inputs.target_branch }}

      # ---- Optionally sync Pro lockfile in same run ----
      - name: Setup pnpm for Pro
        if: inputs.also_sync_pro == true
        working-directory: ${{ env.PRO_DIR }}
        run: |
          PRO_PNPM_VERSION=$(node -p "require('./package.json').packageManager?.split('@')[1] || ''")
          if [ -z "$PRO_PNPM_VERSION" ]; then
            echo "Pro repo has no packageManager pin; skipping Pro sync."
            echo "SKIP_PRO=true" >> "$GITHUB_ENV"
            exit 0
          fi
          corepack prepare pnpm@${PRO_PNPM_VERSION} --activate
          pnpm --version

      - name: Regenerate Pro lockfile
        if: inputs.also_sync_pro == true && env.SKIP_PRO != 'true'
        working-directory: ${{ env.PRO_DIR }}
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: pnpm install --lockfile-only

      - name: Verify Pro --frozen-lockfile passes
        if: inputs.also_sync_pro == true && env.SKIP_PRO != 'true'
        working-directory: ${{ env.PRO_DIR }}
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: pnpm install --frozen-lockfile --lockfile-only

      - name: Check Pro diff scope
        if: inputs.also_sync_pro == true && env.SKIP_PRO != 'true'
        working-directory: ${{ env.PRO_DIR }}
        run: |
          CHANGED=$(git status --porcelain | awk '{print $2}')
          echo "Pro changed files:"
          echo "$CHANGED"
          UNAUTHORIZED=$(echo "$CHANGED" | grep -v -E '^(pnpm-lock\.yaml)$' || true)
          if [ -n "$UNAUTHORIZED" ]; then
            echo "ERROR: Unexpected files modified in Pro:"
            echo "$UNAUTHORIZED"
            exit 1
          fi
          if [ -z "$CHANGED" ]; then
            echo "Pro already in sync"
            echo "PRO_NOTHING_TO_COMMIT=true" >> "$GITHUB_ENV"
          fi

      - name: Commit and push Pro lockfile
        if: inputs.also_sync_pro == true && env.SKIP_PRO != 'true' && env.PRO_NOTHING_TO_COMMIT != 'true'
        working-directory: ${{ env.PRO_DIR }}
        env:
          GH_TOKEN: ${{ secrets.ORQENIX_COORDINATOR_PAT }}
        run: |
          REMOTE_URL="https://x-access-token:${GH_TOKEN}@github.com/milosaysyolo/Orqenix-Pro.git"
          git remote set-url origin "$REMOTE_URL"
          git add pnpm-lock.yaml
          git commit -m "chore: sync pnpm-lock.yaml (manual workflow_dispatch)

          Triggered by: ${{ github.actor }}
          Paired OSS branch: ${{ inputs.target_branch }}
          "
          git push origin HEAD:${{ steps.pro-ref.outputs.ref }}

      - name: Summary
        run: |
          echo "## Lockfile Sync Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- OSS branch: \`${{ inputs.target_branch }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pro ref: \`${{ steps.pro-ref.outputs.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- OSS committed: ${{ env.OSS_NOTHING_TO_COMMIT != 'true' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pro committed: ${{ inputs.also_sync_pro == true && env.PRO_NOTHING_TO_COMMIT != 'true' && env.SKIP_PRO != 'true' }}" >> "$GITHUB_STEP_SUMMARY"
