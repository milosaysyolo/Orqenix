name: Manual Lockfile Sync

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to sync lockfile on"
        required: true
        default: "main"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm via Corepack
        run: |
          corepack enable
          PNPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: Regenerate lockfile
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: pnpm install --lockfile-only

      - name: Verify --frozen-lockfile passes
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: pnpm install --frozen-lockfile --lockfile-only

      - name: Check diff scope
        run: |
          CHANGED=$(git status --porcelain | awk '{print $2}')
          echo "Changed files: $CHANGED"
          UNAUTHORIZED=$(echo "$CHANGED" | grep -v -E '^(pnpm-lock\.yaml)$' || true)
          if [ -n "$UNAUTHORIZED" ]; then
            echo "ERROR: Unexpected files modified:"
            echo "$UNAUTHORIZED"
            exit 1
          fi
          if [ -z "$CHANGED" ]; then
            echo "Already in sync, nothing to commit"
            exit 0
          fi

      - name: Configure git
        run: |
          git config user.name "orqenix-autofix[bot]"
          git config user.email "orqenix-autofix[bot]@users.noreply.github.com"

      - name: Commit and push
        run: |
          if git diff --quiet pnpm-lock.yaml; then
            echo "No changes"
            exit 0
          fi
          git add pnpm-lock.yaml
          git commit -m "chore: sync pnpm-lock.yaml (manual workflow_dispatch)"
          git push origin HEAD:${{ inputs.target_branch }}
