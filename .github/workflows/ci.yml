name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["20", "22"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout OSS
        uses: actions/checkout@v4

      - name: Checkout Orqenix-Pro (sibling)
        uses: ./.github/actions/checkout-orqenix-repo
        with:
          scope: pro
          layout: sibling
          path: ../Orqenix-Pro
          token: ${{ secrets.ORQENIX_COORDINATOR_PAT }}
          fetch-depth: 1
          verify-paths: |
            packages/license

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.ignore-scripts=false

      - name: Rebuild allowlisted native dependencies
        run: pnpm rebuild @mongodb-js/zstd better-sqlite3 esbuild @swc/core sharp --pending --config.ignore-scripts=false

      - name: Prettier check
        run: pnpm exec prettier --check .

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  charter:
    name: Phase 4 Charter (Docker)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Run only on push to main, not on every PR (Docker build is slow)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout OSS (inside workspace)
        uses: actions/checkout@v4
        with:
          path: Orqenix
          fetch-depth: 1

      - name: Resolve Pro ref
        id: pro-ref
        shell: bash
        run: |
          cd Orqenix
          echo "ref=$(node scripts/ci/get-pro-ref.mjs)" >> "$GITHUB_OUTPUT"

      - name: Checkout Orqenix-Pro (sibling layout)
        uses: ./Orqenix/.github/actions/checkout-orqenix-repo
        with:
          scope: pro
          ref: ${{ steps.pro-ref.outputs.ref }}
          layout: sibling
          path: ../Orqenix-Pro
          token: ${{ secrets.ORQENIX_COORDINATOR_PAT }}
          fetch-depth: 1
          verify-paths: |
            packages/license

      - name: Stage Pro at workspace path for Docker
        shell: bash
        run: |
          WORKSPACE_PARENT=$(dirname "$GITHUB_WORKSPACE")
          if [ -d "$WORKSPACE_PARENT/Orqenix-Pro" ]; then
            cp -a "$WORKSPACE_PARENT/Orqenix-Pro" "$GITHUB_WORKSPACE/Orqenix-Pro"
          else
            echo "ERROR: Pro sibling missing after composite checkout"
            exit 1
          fi

      - name: Build charter Docker image
        working-directory: Orqenix
        run: docker build -t orqenix-charter -f charter/Dockerfile .

      - name: Run charter gates in Docker
        working-directory: Orqenix
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/Orqenix:/repo:ro" \
            -v "${{ github.workspace }}/Orqenix-Pro:/Orqenix-Pro:ro" \
            -e ORQENIX_PRO_PATH=/Orqenix-Pro \
            -e CHARTER_VERBOSE=1 \
            orqenix-charter
