name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["22", "24"]
        exclude:
          # windows-latest + Node 22: better-sqlite3 requires VS 2022 for native
          # compilation, but the runner has VS 2025 Preview which node-gyp 10.3.1
          # doesn't recognize. Node 24 runners cover Windows testing.
          - os: windows-latest
            node-version: "22"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout OSS
        uses: actions/checkout@v4

      - name: Checkout Orqenix-Pro (sibling)
        # Skip Pro checkout for fork PRs (secrets not available)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/checkout-orqenix-repo
        with:
          scope: pro
          layout: sibling
          path: ../Orqenix-Pro
          token: ${{ secrets.ORQENIX_COORDINATOR_PAT }}
          fetch-depth: 1
          verify-paths: |
            packages/license

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.ignore-scripts=false

      - name: Rebuild allowlisted native dependencies
        run: pnpm rebuild @mongodb-js/zstd better-sqlite3 esbuild @swc/core sharp --pending --config.ignore-scripts=false

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/transformers
            node_modules/.cache/transformers
            packages/embedding-local/.cache
          key: hf-models-${{ runner.os }}-${{ hashFiles('packages/embedding-local/package.json') }}
          restore-keys: |
            hf-models-${{ runner.os }}-

      - name: Warm HuggingFace cache (best-effort, retries on 429)
        shell: bash
        run: pnpm --filter @orqenix/embedding-local run warm-cache

      - name: Prettier check
        run: pnpm exec prettier --check .

      - name: Audit package hygiene
        run: node scripts/audit/dead-deps.mjs && node scripts/audit/version-consistency.mjs

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (transformers offline)
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: pnpm test

      - name: Lint
        run: pnpm exec turbo run lint

      - name: Version staleness gate
        run: |
          if grep -rn "0\.5\.0-phase-5\|0\.2\.0-dev" --include="*.ts" --include="*.json" --exclude-dir=node_modules . | grep -vE '("version"|VERSION|version:)' | grep -v 'dist/\|\.d\.\(ts\|cts\|mts\)'; then
            echo "Found stale version strings"
            exit 1
          fi
        shell: bash
