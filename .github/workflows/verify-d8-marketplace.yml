name: verify-d8-marketplace

on:
  pull_request:
    paths:
      - "packages/marketplace-core/**"
      - "packages/normalization-engine/**"
      - "packages/input-adapters/**"
      - "packages/output-adapters/**"
      - "packages/marketplace-ui/**"
  push:
    branches: [main, "phase-8/**"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify D8.β (G65 + G66)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile --config.ignore-scripts=false
      - name: Rebuild allowlisted native dependencies
        run: pnpm rebuild @mongodb-js/zstd better-sqlite3 esbuild @swc/core sharp --pending --config.ignore-scripts=false
      - name: Build dependencies
        run: pnpm build
      - name: Typecheck marketplace packages
        shell: bash
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          pnpm exec turbo run typecheck --filter=@orqenix/marketplace-core... --filter=@orqenix/normalization-engine --filter=@orqenix/input-adapters --filter=@orqenix/output-adapters --filter=@orqenix/marketplace-ui
      - name: Test (includes round-trip fidelity gate)
        shell: bash
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          pnpm exec turbo run test --filter=@orqenix/marketplace-core --filter=@orqenix/normalization-engine --filter=@orqenix/input-adapters
      - name: Round-trip fidelity gate (INV-15)
        shell: bash
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          pnpm exec turbo run test --filter=@orqenix/output-adapters
