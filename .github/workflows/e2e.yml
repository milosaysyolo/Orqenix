name: E2E Visual Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (chromium, ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workbench
        run: pnpm --filter @orqenix/workbench build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Prepare engine directory
        run: mkdir -p .orqenix

      - name: Run e2e tests
        env:
          ORQENIX_DEV: "1"
        run: npx playwright test --config apps/workbench/tests/e2e/playwright.config.ts

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: apps/workbench/test-results/
