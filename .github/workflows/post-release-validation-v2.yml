name: Post-Release Validation v2 (Linux)

on:
  workflow_call:
    inputs:
      ref:
        description: "Tag or ref to validate"
        type: string
        default: "v0.7.0"
      strict:
        description: "Fail fast on P0 FAIL"
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      ref:
        type: string
        default: "v0.7.0"
      strict:
        type: boolean
        default: true
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'v0.7.0' }}
          fetch-depth: 1

      - name: Checkout Orqenix-Cloud
        uses: ./.github/actions/checkout-orqenix-repo
        with:
          scope: cloud
          ref: main
          layout: inside
          path: Orqenix-Cloud-checkout
          token: ${{ secrets.ORQENIX_COORDINATOR_PAT }}
          fetch-depth: 1

      - name: Checkout Orqenix-Pro
        uses: ./.github/actions/checkout-orqenix-repo
        with:
          scope: pro
          ref: main
          layout: inside
          path: Orqenix-Pro-checkout
          token: ${{ secrets.ORQENIX_COORDINATOR_PAT }}
          fetch-depth: 1

      - name: Place sibling repos
        run: |
          PARENT="$(dirname "${GITHUB_WORKSPACE}")"
          mv "${GITHUB_WORKSPACE}/Orqenix-Cloud-checkout" "${PARENT}/Orqenix-Cloud"
          mv "${GITHUB_WORKSPACE}/Orqenix-Pro-checkout"   "${PARENT}/Orqenix-Pro"

      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - uses: sigstore/cosign-installer@v3

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run v2 orchestrator
        env:
          STRICT: ${{ inputs.strict || true }}
        run: |
          STRICT_FLAG=""
          if [[ "$STRICT" == "true" ]]; then STRICT_FLAG="--strict"; fi
          node scripts/post-release/v0.7.0-phase-7/v2/run-all.mjs $STRICT_FLAG

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-release-v2-evidence-${{ github.run_id }}
          path: out/v0.7.0-v2/
          retention-days: 30

      - name: Post report to job summary
        if: always()
        run: |
          if [[ -f out/v0.7.0-v2/report.md ]]; then
            cat out/v0.7.0-v2/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
