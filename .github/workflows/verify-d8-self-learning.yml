# Verify D8.γ self-learning packages
name: Verify D8.γ Self-Learning
on:
  push: { branches: [phase-8/self-learning] }
  pull_request: { branches: [main, phase-8/*] }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@orqenix/self-learning-observer --filter=@orqenix/self-learning-detection --filter=@orqenix/instinct-promoter --filter=@orqenix/skill-genesis --filter=@orqenix/verification-loop
      - run: pnpm exec turbo run test --filter=@orqenix/self-learning-observer --filter=@orqenix/self-learning-detection --filter=@orqenix/instinct-promoter --filter=@orqenix/skill-genesis --filter=@orqenix/verification-loop
