# .github/workflows/native-matrix.yml
# Native binding CI matrix for Orqenix Phase 6.
# Per CR v7.2 Chapter 8: 6 Tier-1 blocking + 4 Tier-2 informational runs.
# Applies ONLY to better-sqlite3, blake3-wasm, sqlite-vec. libp2p is pure JS and NOT in scope.
name: Native Binding Matrix

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'scripts/ci/native-matrix/**'
      - '.github/workflows/native-matrix.yml'
      - 'pnpm-lock.yaml'
      - 'package.json'
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: native-matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.os_label }} (Node ${{ matrix.node }}) [tier ${{ matrix.tier }}]
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.tier == 2 }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------------- Tier 1, required (blocking) ----------------
          - tier: 1
            os_label: darwin-arm64
            runner: macos-14
            node: 22
          - tier: 1
            os_label: darwin-arm64
            runner: macos-14
            node: 24
          - tier: 1
            os_label: linux-x64-gnu
            runner: ubuntu-22.04
            node: 22
          - tier: 1
            os_label: linux-x64-gnu
            runner: ubuntu-22.04
            node: 24
          - tier: 1
            os_label: win32-x64
            runner: windows-2022
            node: 22
          - tier: 1
            os_label: win32-x64
            runner: windows-2022
            node: 24

          # ---------------- Tier 2, informational (continue-on-error) --
          - tier: 2
            os_label: darwin-x64
            runner: macos-13
            node: 22
          - tier: 2
            os_label: darwin-x64
            runner: macos-13
            node: 24
          - tier: 2
            os_label: linux-arm64-gnu
            runner: ubuntu-22.04-arm
            node: 22
          - tier: 2
            os_label: linux-arm64-gnu
            runner: ubuntu-22.04-arm
            node: 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ matrix.os_label }}-node${{ matrix.node }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ matrix.os_label }}-node${{ matrix.node }}-

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Verify BLAKE3 fixture
        run: node --experimental-vm-modules scripts/ci/native-matrix/verify-fixture.mjs

      - name: Native smoke test
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: node --experimental-vm-modules scripts/ci/native-matrix/smoke.mjs

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "tier=${{ matrix.tier }} os=${{ matrix.os_label }} node=${{ matrix.node }}"
          echo "result: ${{ job.status }}"
