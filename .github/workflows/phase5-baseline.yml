name: Phase 5 Baseline

on:
  pull_request:
    branches: [main, feat/phase-5-delivery]
  push:
    branches: [main, feat/phase-5-delivery]

concurrency:
  group: phase5-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: "G1: Workspace Foundation"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Orqenix-Pro (sibling)
        uses: ./.github/actions/checkout-orqenix-repo
        with:
          scope: pro
          layout: sibling
          path: ../Orqenix-Pro
          token: ${{ secrets.ORQENIX_COORDINATOR_PAT }}
          fetch-depth: 1
          verify-paths: |
            packages/license

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --config.ignore-scripts=false

      - name: Approve native builds (allowlist only)
        run: pnpm rebuild @mongodb-js/zstd better-sqlite3 esbuild @swc/core sharp --pending --config.ignore-scripts=false

      - name: Build workspace
        run: pnpm build

      - name: Phase 4 stub verification
        run: pnpm tsx scripts/verify-phase-4-stubs.ts

      - name: Phase 5 baseline
        run: pnpm vitest run tests/integration/phase5-baseline.test.ts

      - name: Charter Gate G1
        run: pnpm tsx scripts/gates/G1-workspace-foundation.ts
