name: Phase 5 Baseline

on:
  pull_request:
    branches: [main, feat/phase-5-delivery]
  push:
    branches: [main, feat/phase-5-delivery]

concurrency:
  group: phase5-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: "G1: Workspace Foundation"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Orqenix-Pro
        env:
          PRO_TOKEN: ${{ secrets.ORQENIX_COORDINATOR_PAT }}
        run: git clone --depth 1 --branch v0.5.0-phase-5 https://x-access-token:${PRO_TOKEN}@github.com/milosaysyolo/Orqenix-Pro.git ../Orqenix-Pro

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --config.ignore-scripts=false

      - name: Approve native builds (allowlist only)
        run: pnpm rebuild @mongodb-js/zstd better-sqlite3 esbuild @swc/core --pending --config.ignore-scripts=false

      - name: Build workspace
        run: pnpm build

      - name: Phase 4 stub verification
        run: pnpm tsx scripts/verify-phase-4-stubs.ts

      - name: Phase 5 baseline
        run: pnpm vitest run tests/integration/phase5-baseline.test.ts

      - name: Charter Gate G1
        run: pnpm tsx scripts/gates/G1-workspace-foundation.ts
