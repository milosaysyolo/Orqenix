name: Charter (Phase 4)

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Charter runs independently of the CI test matrix. It validates
# architecture gates inside Docker and must not be blocked by flaky
# unit tests (HuggingFace 429, cache races, etc.).
concurrency:
  group: charter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  charter:
    name: Phase 4 Charter Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout OSS (inside workspace)
        uses: actions/checkout@v4
        with:
          path: Orqenix
          fetch-depth: 1

      - name: Resolve Pro ref
        id: pro-ref
        shell: bash
        run: |
          cd Orqenix
          echo "ref=$(node scripts/ci/get-pro-ref.mjs)" >> "$GITHUB_OUTPUT"

      - name: Checkout Orqenix-Pro (sibling layout)
        uses: ./Orqenix/.github/actions/checkout-orqenix-repo
        with:
          scope: pro
          ref: ${{ steps.pro-ref.outputs.ref }}
          layout: sibling
          path: ../Orqenix-Pro
          token: ${{ secrets.ORQENIX_COORDINATOR_PAT }}
          fetch-depth: 1
          verify-paths: |
            packages/license

      - name: Stage Pro at workspace path for Docker
        shell: bash
        run: |
          WORKSPACE_PARENT=$(dirname "$GITHUB_WORKSPACE")
          if [ -d "$WORKSPACE_PARENT/Orqenix-Pro" ]; then
            cp -a "$WORKSPACE_PARENT/Orqenix-Pro" "$GITHUB_WORKSPACE/Orqenix-Pro"
          else
            echo "ERROR: Pro sibling missing after composite checkout"
            exit 1
          fi

      - name: Verify Docker available
        run: docker --version

      - name: Build charter Docker image
        working-directory: Orqenix
        run: docker build -t orqenix-charter -f charter/Dockerfile .

      - name: Run charter gates in Docker
        working-directory: Orqenix
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/Orqenix:/repo:ro" \
            -v "${{ github.workspace }}/Orqenix-Pro:/Orqenix-Pro:ro" \
            -e ORQENIX_PRO_PATH=/Orqenix-Pro \
            -e CHARTER_VERBOSE=1 \
            orqenix-charter

      - name: Charter summary
        if: always()
        run: |
          echo "## Charter (Phase 4) Run" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- OSS commit: $(cd Orqenix && git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pro commit: $(cd Orqenix-Pro && git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
