name: Charter (Phase 4)

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Charter runs independently of the CI test matrix. It validates
# architecture gates inside Docker and must not be blocked by flaky
# unit tests (HuggingFace 429, cache races, etc.).
concurrency:
  group: charter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  charter:
    name: Phase 4 Charter Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout OSS (inside workspace)
        uses: actions/checkout@v4
        with:
          path: Orqenix
          fetch-depth: 1

      - name: Resolve Pro ref
        id: pro-ref
        shell: bash
        run: |
          cd Orqenix
          echo "ref=$(node scripts/ci/get-pro-ref.mjs)" >> "$GITHUB_OUTPUT"

      - name: Checkout Orqenix-Pro (sibling layout)
        # Skip Pro checkout for fork PRs (secrets not available)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ./Orqenix/.github/actions/checkout-orqenix-repo
        with:
          scope: pro
          ref: ${{ steps.pro-ref.outputs.ref }}
          layout: sibling
          path: ../Orqenix-Pro
          token: ${{ secrets.ORQENIX_COORDINATOR_PAT }}
          fetch-depth: 1
          verify-paths: |
            packages/license

      - name: Resolve Pro absolute path
        id: pro-path
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          WORKSPACE_PARENT=$(dirname "$GITHUB_WORKSPACE")
          echo "abs=$WORKSPACE_PARENT/Orqenix-Pro" >> "$GITHUB_OUTPUT"

      - name: Cache HuggingFace models for charter
        uses: actions/cache@v4
        with:
          path: charter-hf-cache
          key: hf-charter-${{ runner.os }}-${{ hashFiles('Orqenix/packages/embedding-local/package.json') }}
          restore-keys: |
            hf-charter-${{ runner.os }}-

      - name: Prepare HF cache dir
        run: |
          mkdir -p charter-hf-cache
          chmod -R 777 charter-hf-cache

      - name: Build charter Docker image
        working-directory: Orqenix
        run: docker build -t orqenix-charter -f charter/Dockerfile .

      - name: Run charter gates in Docker
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: Orqenix
        env:
          PRO_ABS: ${{ steps.pro-path.outputs.abs }}
        run: |
          # NOTE: mounts are WRITABLE (no :ro) because run.sh does pnpm install
          # which must write node_modules into /repo and into the Pro repo (G10).
          docker run --rm \
            -v "${{ github.workspace }}/Orqenix:/repo" \
            -v "$PRO_ABS:/Orqenix-Pro" \
            -v "${{ github.workspace }}/charter-hf-cache:/root/.cache/huggingface" \
            -e ORQENIX_PRO_PATH=/Orqenix-Pro \
            -e CHARTER_VERBOSE=1 \
            -e HF_HOME=/root/.cache/huggingface \
            orqenix-charter

      - name: Charter summary
        if: always()
        run: |
          echo "## Charter (Phase 4) Run" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- OSS commit: $(cd Orqenix && git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          PRO_DIR="${{ github.workspace }}/../Orqenix-Pro"
          if [ -d "$PRO_DIR" ]; then
            echo "- Pro commit: $(cd "$PRO_DIR" && git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Pro commit: not checked out (skipped on fork PR)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Trigger: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
