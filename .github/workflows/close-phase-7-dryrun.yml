name: Close Phase 7 \u2014 DRY RUN (no publish)

on:
  workflow_dispatch:

env:
  RELEASE_VERSION: '0.7.0'
  RELEASE_TAG: 'v0.7.0'

permissions:
  contents: read
  packages: read

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Orqenix (OSS)
        uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }

      - name: Checkout Orqenix-Pro (sibling)
        uses: actions/checkout@v4
        with:
          repository: milosaysyolo/Orqenix-Pro
          token: ${{ secrets.ORQENIX_COORDINATOR_PAT }}
          path: Orqenix-Pro-checkout
          ref: main

      - name: Checkout Orqenix-Cloud (sibling)
        uses: actions/checkout@v4
        with:
          repository: milosaysyolo/Orqenix-Cloud
          token: ${{ secrets.ORQENIX_COORDINATOR_PAT }}
          path: Orqenix-Cloud-checkout
          ref: main

      - name: Place sibling repos
        run: |
          PARENT="$(dirname "${GITHUB_WORKSPACE}")"
          mv "${GITHUB_WORKSPACE}/Orqenix-Cloud-checkout" "${PARENT}/Orqenix-Cloud"
          mv "${GITHUB_WORKSPACE}/Orqenix-Pro-checkout"   "${PARENT}/Orqenix-Pro"

      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - uses: docker/setup-buildx-action@v3
      - uses: anchore/sbom-action/download-syft@v0

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run dry-run script
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          SIGN_DRY_RUN: 'true'
        run: bash scripts/release/close-phase-7/dry-run.sh

      - name: Upload dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: close-phase-7-dryrun-${{ github.run_id }}
          path: out/close-phase-7/
          retention-days: 14
