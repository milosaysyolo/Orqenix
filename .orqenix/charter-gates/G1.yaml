schemaVersion: 1
id: G1
title: Workspace Foundation
bsRef: docs/sdd/BS-001-workspace-foundation.md
description: |
  G1 validates the Phase 5 monorepo workspace is buildable, dependency-clean,
  and preserves all Phase 4 contracts. No downstream gate (G2-G35) may run
  until G1 is green.

criteria:
  - {
      id: G1.1,
      description: "pnpm-workspace.yaml resolves >= 40 packages (OSS)",
      severity: blocking,
    }
  - {
      id: G1.2,
      description: "every package has a parseable package.json with required fields (name, version, license)",
      severity: blocking,
    }
  - {
      id: G1.3,
      description: "no circular dependencies between packages (madge)",
      severity: blocking,
    }
  - {
      id: G1.4,
      description: "topological tsc --build succeeds for every package",
      severity: blocking,
    }
  - {
      id: G1.5,
      description: "Phase 4 plugin-compress-input tests pass unchanged",
      severity: blocking,
    }
  - {
      id: G1.6,
      description: "Phase 4 contract snapshot (compress-context v1) matches",
      severity: blocking,
    }
  - { id: G1.7, description: "Phase 5 baseline integration test suite passes", severity: blocking }
  - {
      id: G1.8,
      description: "no OSS package imports any Pro package (depcruise)",
      severity: blocking,
    }

artifacts:
  reportDir: .orqenix/gate-reports/
  reportPattern: "G1-*.json"
